name: cdc-debezium-flink

services:
  mysql:
    image: mysql:8.4
    container_name: cdc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shop}
      MYSQL_USER: ${MYSQL_APP_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-apppw}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/cdc.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [cdc-net]

  postgres:
    image: postgres:17
    container_name: cdc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [cdc-net]

  kafka:
    image: quay.io/debezium/kafka:3.6
    container_name: cdc-kafka
    hostname: kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-cdc-lab-cluster-20260723}
      NODE_ID: "1"
      NODE_ROLE: combined
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/kafka/data
    networks: [cdc-net]

  kafka-init:
    image: quay.io/debezium/kafka:3.6
    container_name: cdc-kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        until /kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
          echo "Waiting for Kafka..."
          sleep 3
        done

        /kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic schema-history.shop \
          --partitions 1 --replication-factor 1 \
          --config cleanup.policy=delete \
          --config retention.ms=-1

        /kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic mysql.shop.orders \
          --partitions 6 --replication-factor 1 \
          --config cleanup.policy=delete \
          --config retention.ms=604800000

        /kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic mysql.shop.customers \
          --partitions 3 --replication-factor 1 \
          --config cleanup.policy=delete \
          --config retention.ms=604800000

        /kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic mysql \
          --partitions 1 --replication-factor 1 \
          --config cleanup.policy=delete \
          --config retention.ms=604800000

        echo "Kafka topics are ready."
    networks: [cdc-net]

  connect:
    image: quay.io/debezium/connect:3.6
    container_name: cdc-connect
    depends_on:
      mysql:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "cdc-connect-cluster"
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      OFFSET_FLUSH_INTERVAL_MS: "10000"
      REST_HOST_NAME: 0.0.0.0
      HEAP_OPTS: "-Xms512m -Xmx1g"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [cdc-net]

  flink-jobmanager:
    build:
      context: ./flink
    container_name: cdc-flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        parallelism.default: 3
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.min-pause: 5s
        execution.checkpointing.timeout: 2min
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        execution.checkpointing.dir: file:///checkpoints
        execution.checkpointing.savepoint-dir: file:///savepoints
        restart-strategy.type: exponential-delay
        restart-strategy.exponential-delay.initial-backoff: 2s
        restart-strategy.exponential-delay.max-backoff: 2min
        restart-strategy.exponential-delay.backoff-multiplier: 2.0
        restart-strategy.exponential-delay.reset-backoff-threshold: 10min
        restart-strategy.exponential-delay.jitter-factor: 0.1
    volumes:
      - flink_checkpoints:/checkpoints
      - flink_savepoints:/savepoints
      - ./flink/sql:/opt/flink/sql:ro
    depends_on:
      - kafka-init
      - postgres
    networks: [cdc-net]

  flink-taskmanager:
    build:
      context: ./flink
    container_name: cdc-flink-taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 6
        parallelism.default: 3
        taskmanager.memory.process.size: 2048m
    volumes:
      - flink_checkpoints:/checkpoints
      - flink_savepoints:/savepoints
      - ./flink/sql:/opt/flink/sql:ro
    depends_on:
      - flink-jobmanager
    networks: [cdc-net]

  flink-sql:
    build:
      context: ./flink
    container_name: cdc-flink-sql-client
    command: bin/sql-client.sh
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
    volumes:
      - ./flink/sql:/opt/flink/sql:ro
    depends_on:
      - flink-jobmanager
      - flink-taskmanager
    networks: [cdc-net]

volumes:
  mysql_data:
  postgres_data:
  kafka_data:
  flink_checkpoints:
  flink_savepoints:

networks:
  cdc-net:
    driver: bridge
